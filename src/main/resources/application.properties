spring.application.name=crm-assistente-poc
server.port=8080

spring.datasource.url=jdbc:h2:mem:crm_poc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

whatsapp.webhook.verify-token=tcc-poc-whatsapp-verify-token

api.request-log.file=logs/api-requests.txt
